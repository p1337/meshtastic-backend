name: Native LoRa Lab Apple-signed IPA
on:
  push:
    branches: [codex/native-lora-ios]
    paths: [native-lora-ios/**, .github/workflows/native-lora-ipa.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-lora-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-signed-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    environment: apple-signing
    steps:
      - name: Require Apple signing credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 || vars.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_P12_PASSWORD IOS_ADHOC_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing value $name in apple-signing. Follow native-lora-ios/SIGNING.md."
              missing=1
            fi
          done
          test "$missing" = 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test, archive, sign and verify with Apple Distribution
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 || vars.IOS_ADHOC_PROFILE_BASE64 }}
        run: bash native-lora-ios/scripts/build-signed-ipa.sh
      - name: Upload verified Apple-signed IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LoRaLab-Apple-signed-IPA
          path: |
            native-lora-ios/build-signed/LoRaLab-Apple-signed.ipa
            native-lora-ios/build-signed/SHA256SUMS.txt
            native-lora-ios/build-signed/signature-verification.json
            native-lora-ios/build-signed/test-results.txt
          if-no-files-found: error
          retention-days: 30
