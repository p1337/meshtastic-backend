name: Streckenschmiede iOS – Build & Sign
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Streckenschmiede/**'
      - '.github/workflows/streckenschmiede-release.yml'
concurrency:
  group: streckenschmiede-release
  cancel-in-progress: false
jobs:
  iphone:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout Streckenschmiede source
        uses: actions/checkout@v4
        with:
          ref: streckenschmiede-ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: Streckenschmiede
        run: xcodegen generate
      - name: Build unsigned iPhone app (compiler gate)
        working-directory: Streckenschmiede
        run: |
          set -o pipefail
          xcodebuild -project Streckenschmiede.xcodeproj -scheme Streckenschmiede -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: Streckenschmiede-unsigned-app
          path: Streckenschmiede/build/Build/Products/Release-iphoneos/Streckenschmiede.app
          if-no-files-found: error
      - name: Check Apple signing secrets
        id: signing
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -n "$CERT" && -n "$PASS" && -n "$PROFILE" && -n "$TEAM" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets missing. Expected IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID."
          fi
      - name: Install signing credentials
        if: steps.signing.outputs.available == 'true'
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/streckenschmiede.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$PASS" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/streckenschmiede.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_uuid"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_name"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_app_id"
          cat "$RUNNER_TEMP/profile_app_id"
      - name: Verify bundle ID matches provisioning profile
        if: steps.signing.outputs.available == 'true'
        run: |
          APP_ID=$(cat "$RUNNER_TEMP/profile_app_id")
          if [[ "$APP_ID" != *".de.p1337.Streckenschmiede" ]]; then
            echo "::error::Existing profile is not for de.p1337.Streckenschmiede; do not sign with Werkbeleg profile."
            exit 1
          fi
      - name: Archive signed app
        if: steps.signing.outputs.available == 'true'
        working-directory: Streckenschmiede
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          PROFILE_NAME=$(cat "$RUNNER_TEMP/profile_name")
          xcodebuild -project Streckenschmiede.xcodeproj -scheme Streckenschmiede -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Streckenschmiede.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>teamID</key><string>$TEAM</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>de.p1337.Streckenschmiede</key><string>$(cat "$RUNNER_TEMP/profile_name")</string>
          </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Streckenschmiede.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Upload signed IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Streckenschmiede-signed-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
