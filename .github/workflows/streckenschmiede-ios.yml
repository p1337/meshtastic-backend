name: Streckenschmiede Apple-signed iPhone App
on:
  push:
    branches: [streckenschmiede-ios, master]
    paths:
      - 'Streckenschmiede/**'
      - '.github/workflows/streckenschmiede-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-signed-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 30
    environment: apple-signing
    steps:
      - name: Require existing Apple signing credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_P12_PASSWORD IOS_ADHOC_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing existing signing value $name in apple-signing."
              missing=1
            fi
          done
          test "$missing" = 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use selected Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate Swift syntax
        run: xcrun swiftc -frontend -parse Streckenschmiede/Sources/*.swift
      - name: Test ride session state and recovery
        run: |
          xcrun swiftc Streckenschmiede/Sources/RideSessionEngine.swift Streckenschmiede/Tests/RideSessionEngineSelfTest.swift -o "$RUNNER_TEMP/ride-session-tests"
          "$RUNNER_TEMP/ride-session-tests"
      - name: Generate project
        working-directory: Streckenschmiede
        run: xcodegen generate
      - name: Compile iPhone app without signing
        working-directory: Streckenschmiede
        run: |
          set -o pipefail
          xcodebuild -project Streckenschmiede.xcodeproj -scheme Streckenschmiede -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/unsigned" CODE_SIGNING_ALLOWED=NO build
      - name: Upload compiled app for diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Streckenschmiede-unsigned-diagnostic
          path: ${{ runner.temp }}/unsigned/Build/Products/Release-iphoneos/Streckenschmiede.app
          if-no-files-found: error
          retention-days: 14
      - name: Install and validate existing Apple identity
        id: provision
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          export SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/streckenschmiede-signing.XXXXXX")
          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ["SIGNING_DIR"])
          for env, name in (
              ("IOS_DISTRIBUTION_P12_BASE64", "distribution.p12"),
              ("IOS_ADHOC_PROFILE_BASE64", "profile.mobileprovision"),
          ):
              data = base64.b64decode("".join(os.environ[env].split()), validate=True)
              if not data:
                  raise ValueError(f"Empty signing input: {env}")
              (root / name).write_bytes(data)
          PY
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          python3 - <<'PY'
          import datetime, hashlib, os, plistlib, re
          from pathlib import Path
          root = Path(os.environ["SIGNING_DIR"])
          profile = plistlib.loads((root / "profile.plist").read_bytes())
          team = profile["TeamIdentifier"][0]
          prefix = profile["ApplicationIdentifierPrefix"][0]
          entitlements = profile["Entitlements"]
          app_id = entitlements.get("application-identifier", "")
          if not re.fullmatch(r"[A-Z0-9]{10}", team):
              raise ValueError("Invalid Team ID in existing profile")
          if entitlements.get("com.apple.developer.team-identifier") != team:
              raise ValueError("Profile Team ID mismatch")
          if not app_id.startswith(prefix + "."):
              raise ValueError("Profile App ID prefix mismatch")
          bundle = app_id[len(prefix) + 1:]
          if not bundle or "*" in bundle:
              raise ValueError("A specific existing bundle ID is required")
          if entitlements.get("get-task-allow", False):
              raise ValueError("A distribution profile is required")
          if not (profile.get("ProvisionedDevices") or profile.get("ProvisionsAllDevices")):
              raise ValueError("Profile does not support OTA distribution")
          expiry = profile.get("ExpirationDate")
          if not isinstance(expiry, datetime.datetime) or expiry <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise ValueError("Existing provisioning profile expired")
          certificates = profile.get("DeveloperCertificates", [])
          if not certificates:
              raise ValueError("Provisioning profile contains no distribution certificates")
          # A valid Ad Hoc profile may list several allowed distribution identities.
          # Match the imported P12 to one of them instead of assuming exactly one.
          fingerprints = {hashlib.sha1(cert).hexdigest().upper() for cert in certificates}
          (root / "valid_profile_identities").write_text("\n".join(sorted(fingerprints)) + "\n")
          export_method = "enterprise" if profile.get("ProvisionsAllDevices") else "release-testing"
          values = {
              "bundle_id": bundle,
              "team_id": team,
              "profile_uuid": profile["UUID"],
              "export_method": export_method,
          }
          for name, value in values.items():
              (root / name).write_text(value)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  print(f"{name}={value}", file=output)
          print(f"Validated existing {export_method} profile for {bundle}; registered devices: {len(profile.get('ProvisionedDevices', []))}")
          PY
          KEYCHAIN="$SIGNING_DIR/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$SIGNING_DIR/distribution.p12" -P "$IOS_P12_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security > "$SIGNING_DIR/import.log" 2>&1; then
            OPENSSL3=""
            for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl "$(command -v openssl)"; do
              if [ -x "$candidate" ] && "$candidate" version | grep -q '^OpenSSL 3\.'; then OPENSSL3="$candidate"; break; fi
            done
            test -n "$OPENSSL3"
            "$OPENSSL3" pkcs12 -in "$SIGNING_DIR/distribution.p12" -passin env:IOS_P12_PASSWORD -passout env:IOS_P12_PASSWORD -out "$SIGNING_DIR/identity-encrypted.pem"
            "$OPENSSL3" pkcs12 -export -legacy -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -in "$SIGNING_DIR/identity-encrypted.pem" -out "$SIGNING_DIR/compatible.p12" -passin env:IOS_P12_PASSWORD -passout env:IOS_P12_PASSWORD
            security import "$SIGNING_DIR/compatible.p12" -P "$IOS_P12_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
            rm -f "$SIGNING_DIR/identity-encrypted.pem" "$SIGNING_DIR/compatible.p12"
            echo "Imported unchanged Apple identity after PKCS12 compatibility conversion."
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" /Library/Keychains/System.keychain
          security find-identity -v -p codesigning "$KEYCHAIN" > "$SIGNING_DIR/identities.txt"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["SIGNING_DIR"])
          valid = set((root / "valid_profile_identities").read_text().splitlines())
          installed = (root / "identities.txt").read_text()
          matches = []
          for line in installed.splitlines():
              fingerprint = re.search(r"\b([0-9a-fA-F]{40})\b", line)
              if fingerprint and "Apple Distribution:" in line:
                  candidate = fingerprint.group(1).upper()
                  if candidate in valid:
                      matches.append(candidate)
          if not matches:
              raise ValueError("Existing P12 identity is not an Apple Distribution certificate allowed by the Ad Hoc profile")
          identity = matches[0]
          (root / "identity").write_text(identity)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"identity={identity}", file=outputs)
          print("Validated that the imported Apple Distribution certificate is listed in the existing provisioning profile.")
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGNING_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(cat "$SIGNING_DIR/profile_uuid").mobileprovision"
      - name: Archive signed Streckenschmiede
        working-directory: Streckenschmiede
        run: |
          set -euo pipefail
          xcodebuild -project Streckenschmiede.xcodeproj -scheme Streckenschmiede -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Streckenschmiede.xcarchive" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" DEVELOPMENT_TEAM="${{ steps.provision.outputs.team_id }}" PRODUCT_BUNDLE_IDENTIFIER="${{ steps.provision.outputs.bundle_id }}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="${{ steps.provision.outputs.identity }}" PROVISIONING_PROFILE_SPECIFIER="${{ steps.provision.outputs.profile_uuid }}" archive
      - name: Export Apple-signed IPA
        env:
          TEAM_ID: ${{ steps.provision.outputs.team_id }}
          BUNDLE_ID: ${{ steps.provision.outputs.bundle_id }}
          PROFILE_UUID: ${{ steps.provision.outputs.profile_uuid }}
          IDENTITY: ${{ steps.provision.outputs.identity }}
          EXPORT_METHOD: ${{ steps.provision.outputs.export_method }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": os.environ["IDENTITY"],
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_UUID"]},
              "stripSwiftSymbols": True,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist").write_bytes(plistlib.dumps(options))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Streckenschmiede.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Verify Apple signature and package OTA store
        env:
          STRECKENSCHMIEDE_BUNDLE_ID: ${{ steps.provision.outputs.bundle_id }}
          TEAM_ID: ${{ steps.provision.outputs.team_id }}
          PROFILE_UUID: ${{ steps.provision.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -type f -print -quit)
          test -n "$IPA"
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$IPA" "$RUNNER_TEMP/verify"
          APP=$(find "$RUNNER_TEMP/verify/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" > "$RUNNER_TEMP/signature.txt" 2>&1
          grep -q 'Authority=Apple Distribution:' "$RUNNER_TEMP/signature.txt"
          grep -q "TeamIdentifier=$TEAM_ID" "$RUNNER_TEMP/signature.txt"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/embedded.plist"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          profile = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / "embedded.plist").read_bytes())
          if profile["UUID"] != os.environ["PROFILE_UUID"]:
              raise ValueError("Export changed provisioning profile")
          if profile["TeamIdentifier"][0] != os.environ["TEAM_ID"]:
              raise ValueError("Export changed Apple team")
          print("Verified Apple Distribution signature and embedded OTA profile.")
          PY
          python3 Streckenschmiede/scripts/package_release.py --ipa "$IPA" --store-html Streckenschmiede/webstore/index.html --out "$RUNNER_TEMP/site" --base-url "https://p1337.github.io/meshtastic-backend/"
      - name: Upload verified signed IPA and OTA files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Streckenschmiede-signed-OTA
          path: ${{ runner.temp }}/site/
          if-no-files-found: error
          retention-days: 30
      - name: Upload GitHub Pages package
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/site/
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${SIGNING_DIR:-}" ]; then
            security delete-keychain "$SIGNING_DIR/signing.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$SIGNING_DIR"
          fi

  deploy-iphone-install-page:
    needs: build-signed-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed iPhone installation page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
