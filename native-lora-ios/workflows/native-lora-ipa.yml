name: Native LoRa Lab Apple-signed IPA
on:
  push:
    branches: [codex/native-lora-ios]
    paths: [native-lora-ios/**, .github/workflows/native-lora-ipa.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-lora-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-signed-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    environment: apple-signing
    steps:
      - name: Require Apple signing credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_P12_PASSWORD IOS_ADHOC_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing value $name in apple-signing. Follow native-lora-ios/SIGNING.md."
              missing=1
            fi
          done
          test "$missing" = 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run fast native regression suite
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p native-lora-ios/build-signed
          xcrun swiftc -O native-lora-ios/Sources/CSS.swift native-lora-ios/Sources/Diagnostics.swift native-lora-ios/Sources/RuntimeAudit.swift native-lora-ios/Tests/main.swift -o native-lora-ios/build-signed/css-tests
          native-lora-ios/build-signed/css-tests --json native-lora-ios/build-signed/diagnostics-report.json | tee native-lora-ios/build-signed/test-results.txt
      - name: Upload native regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LoRaLab-native-diagnostics
          path: |
            native-lora-ios/build-signed/diagnostics-report.json
            native-lora-ios/build-signed/test-results.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Build and automatically test native app in iOS Simulator
        timeout-minutes: 12
        run: bash native-lora-ios/scripts/test-simulator.sh
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LoRaLab-simulator-diagnostics
          path: |
            native-lora-ios/build-simulator/simulator-report.json
            native-lora-ios/build-simulator/simulator-tests.png
            native-lora-ios/build-simulator/AppIcon.png
            native-lora-ios/build-simulator/build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Test, archive, sign and verify with Apple Distribution
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: bash native-lora-ios/scripts/build-signed-ipa.sh
      - name: Upload verified Apple-signed IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LoRaLab-Apple-signed-IPA
          path: |
            native-lora-ios/build-signed/LoRaLab-Apple-signed.ipa
            native-lora-ios/build-signed/SHA256SUMS.txt
            native-lora-ios/build-signed/signature-verification.json
            native-lora-ios/build-signed/test-results.txt
            native-lora-ios/build-signed/diagnostics-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare iPhone installation page
        run: |
          python3 native-lora-ios/scripts/prepare-ota.py \
            --build-directory native-lora-ios/build-signed \
            --base-url https://p1337.github.io/meshtastic-backend \
            --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output native-lora-ios/build-signed/ota
      - name: Upload installation site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: native-lora-ios/build-signed/ota
  deploy-iphone-install-page:
    needs: build-signed-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed iPhone installation page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

