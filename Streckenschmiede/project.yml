name: Streckenschmiede
options:
  bundleIdPrefix: de.p1337
targets:
  Streckenschmiede:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Streckenschmiede
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocationWhenInUseUsageDescription: "GPS-Fahrten aufzeichnen und auf der Fahrradkarte navigieren"
        NSLocationAlwaysAndWhenInUseUsageDescription: "Eine gestartete Fahrradfahrt auch bei gesperrtem Display weiter aufzeichnen"
        NSBluetoothAlwaysUsageDescription: "Fahrradtrainer, Pulsmesser, Leistungsmesser und Zwift Click verbinden"
        NSAppleMusicUsageDescription: "Apple Music nur nach deiner Freigabe im Outdoor-Cockpit anzeigen und steuern"
        UIBackgroundModes:
          - location
          - bluetooth-central
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX-Fahrradroute
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: de.p1337.Streckenschmiede
      MARKETING_VERSION: "2.5.5"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
